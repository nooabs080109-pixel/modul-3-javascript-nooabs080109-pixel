<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uppgift 2: Buttons</title>
  </head>
  <body>
    <h2>Vad är 2 + 2?</h2>
    <button onclick="showIncorrect()">3</button>
    <button onclick="showIncorrect()">5</button>
    <button onclick="showCorrect()">4</button>
    <button onclick="showIncorrect()">6</button>
    <button onclick="showIncorrect()">7</button>
  </body>

  <script>
    function showCorrect() {
      alert("Rätt svar!");
    }

    function showIncorrect() {
      alert("Fel svar!");
    }
  </script>
</html>
